          </main>
        </div>
        <div class="preview-tools" aria-label="Preview controls"><strong>Reader &amp; compact reply MVP</strong><label><input type="checkbox" id="large"/>125% text</label><p class="preview-state" role="status"></p></div>
        <dialog aria-labelledby="dialog-title"><h2 id="dialog-title">Settings</h2><p>Preview only. No preferences are saved.</p><section aria-labelledby="appearance-heading"><h3 id="appearance-heading">Appearance</h3><p>Your existing appearance controls belong here.</p></section><section aria-labelledby="about-heading"><h3 id="about-heading">About this workspace</h3><p>TSDM — a workspace for boards, threads and private conversations.</p></section><button id="close-dialog">Close</button></dialog>
        <dialog id="page-dialog" aria-labelledby="page-title"><h2 id="page-title">Jump to page</h2><form id="page-form"><label for="page-slider">Choose page <output id="page-choice">1</output> of 92</label><input id="page-slider" aria-label="Page slider" type="range" min="1" max="92" step="1" value="1"/><label for="page-number">Page number</label><input id="page-number" type="number" min="1" max="92" step="1" required value="1"/><div class="reply-footer"><button type="button" id="page-cancel">Cancel</button><button type="submit">Go to page</button></div></form></dialog>
        <dialog id="reply-dialog" aria-labelledby="review-title"><h2 id="review-title">Review reply</h2><p id="review-target"></p><div id="review-copy"></div><p>Preview only. No reply will be sent.</p><button id="review-close">Back to writing</button></dialog>
      </div>`;
      host.dataset.variant = "A";
      host.dataset.colors = "groups";
      const url = new URL(location.href);
      url.searchParams.set("variant", "A");
      history.replaceState(null, "", url);
      let selectedBoard = null;
      let selectedThread = null;
      let mobileView = "results";
      let page = 1;
      let reverse = false;
      let replyTarget = null;
      const showView = (view) => {
        mobileView = view;
        host.dataset.mobileView = view;
        root
          .querySelectorAll("[data-pane]")
          .forEach((button) =>
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.pane === view),
            ),
          );
        state();
      };
      const state = () => {
        host.style.setProperty(
          "--text-scale",
          root.querySelector("#large").checked ? "1.25" : "1",
        );
        root.querySelector(".preview-state").textContent =
          `View: ${mobileView} · ${selectedBoard === null ? "Board directory" : boards[selectedBoard][0]} · ${selectedThread ? "Sample thread retained" : "No thread selected"} · ${root.querySelector("#large").checked ? "125%" : "100%"} text · Synthetic preview`;
      };
      root.querySelector("#large").addEventListener("change", state);
      const dialog = root.querySelector("dialog");
      root.querySelectorAll("[data-dialog]").forEach((button) =>
        button.addEventListener("click", () => {
          root.querySelector("#dialog-title").textContent =
            button.dataset.dialog;
          dialog.showModal();
        }),
      );
      root
        .querySelector("#close-dialog")
        .addEventListener("click", () => dialog.close());
      root.querySelectorAll("[data-stub]").forEach((control) =>
        control.addEventListener("click", (event) => {
          event.preventDefault();
          root.querySelector(".preview-state").textContent =
            `${control.dataset.stub}: visual preview only; no forum action performed.`;
        }),
      );
      root.querySelectorAll("[data-pane]").forEach((button) =>
        button.addEventListener("click", () => {
          const pane = button.dataset.pane;
          const closing =
            mobileView === pane &&
            (pane === "boards" || matchMedia("(max-width:767px)").matches);
          showView(closing ? (selectedThread ? "reader" : "results") : pane);
        }),
      );
      const showBoard = (index) => {
        selectedBoard = index;
        root.querySelector("#results-title").textContent =
          index === null ? "Boards" : boards[index][0];
        root.querySelector("#directory-results").hidden = index !== null;
        root.querySelector("#thread-results").hidden = index === null;
        root.querySelector("#list-back").hidden = index === null;
        root
          .querySelectorAll("[data-thread]")
          .forEach((button) => button.removeAttribute("aria-current"));
        root.querySelector(".preview-results").scrollTop = 0;
        showView("results");
        root.querySelector("#results-title").focus();
      };
      root.querySelectorAll("[data-board]").forEach((link) =>
        link.addEventListener("click", (event) => {
          event.preventDefault();
          showBoard(Number(link.dataset.board));
        }),
      );
      root.querySelectorAll("[data-all-boards]").forEach((link) =>
        link.addEventListener("click", (event) => {
          event.preventDefault();
          showBoard(null);
        }),
      );
      root.querySelectorAll("[data-thread]").forEach((button) =>
        button.addEventListener("click", () => {
          selectedThread = {
            ...sampleThreads.find(
              (thread) => thread.id === Number(button.dataset.thread),
            ),
            board: boards[selectedBoard][0],
            boardIndex: selectedBoard,
          };
          root
            .querySelectorAll("[data-thread]")
            .forEach((item) =>
              item.setAttribute("aria-current", String(item === button)),
            );
          root.querySelector("#reader-title").textContent =
            selectedThread.title;
          root.querySelector("#reader-board").textContent =
            selectedThread.board;
          root.querySelector("#reader-empty").hidden = true;
          root.querySelector("#reader-content").hidden = false;
          page = 1;
          renderPage();
          updateReply();
          showView("reader");
          root.querySelector("#reader-title").focus();
        }),
      );
      root.querySelector("#reader-board").addEventListener("click", (event) => {
        event.preventDefault();
        showBoard(selectedThread.boardIndex);
      });
      const more = root.querySelector(".reader-more");
      more.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          more.open = false;
          more.querySelector("summary").focus();
        }
      });
      more.querySelectorAll("button").forEach((button) =>
        button.addEventListener("click", () => {
          more.open = false;
          more.querySelector("summary").focus();
        }),
      );
      const renderPage = () => {
        root.querySelector("#page-open").textContent = `Page ${page} / 92`;
        root.querySelector("#page-prev").disabled = page === 1;
        root.querySelector("#page-next").disabled = page === 92;
        root.querySelector("#order-state").hidden = !reverse;
        root
          .querySelector("#reverse-order")
          .setAttribute("aria-pressed", String(reverse));
        const numbers = [1, 2, 3].map((n) => (page - 1) * 3 + n);
        if (reverse) numbers.reverse();
        root.querySelector("#sample-posts").innerHTML = numbers
          .map(
            (n) =>
              `<article class="sample-post" lang="zh-Hans"><small>demo-member · Sample post ${n} · Page ${page}</small><p>这是用于预览阅读布局的示例内容。</p><p>一起交流想法，分享最近的发现。</p></article>`,
          )
          .join("");
        root.querySelector(".reader-scroll").scrollTop = 0;
      };
      root.querySelector("#reverse-order").addEventListener("click", () => {
        reverse = !reverse;
        renderPage();
      });
      for (const [id, delta] of [
        ["page-prev", -1],
        ["page-next", 1],
      ]) {
        root.querySelector(`#${id}`).addEventListener("click", () => {
          page = Math.max(1, Math.min(92, page + delta));
          renderPage();
        });
      }
      const pageDialog = root.querySelector("#page-dialog");
      const slider = root.querySelector("#page-slider");
      const pageNumber = root.querySelector("#page-number");
      root.querySelector("#page-open").addEventListener("click", () => {
        slider.value = pageNumber.value = String(page);
        root.querySelector("#page-choice").textContent = String(page);
        pageDialog.showModal();
        slider.focus();
      });
      slider.addEventListener("input", () => {
        pageNumber.value = slider.value;
        root.querySelector("#page-choice").textContent = slider.value;
      });
      pageNumber.addEventListener("input", () => {
        if (pageNumber.checkValidity()) {
          slider.value = pageNumber.value;
          root.querySelector("#page-choice").textContent = pageNumber.value;
        }
      });
      root
        .querySelector("#page-cancel")
        .addEventListener("click", () => pageDialog.close());
      root.querySelector("#page-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!pageNumber.reportValidity()) return;
        page = Number(pageNumber.value);
        renderPage();
        pageDialog.close();
      });
      const composer = root.querySelector(".reply-composer");
      const replyText = root.querySelector("#reply-text");
      const updateReply = () => {
        root.querySelector("#reply-open").hidden = !composer.hidden;
        root.querySelector("#reply-open").textContent = replyTarget
          ? "Resume reply"
          : "Reply";
        root.querySelector("#reply-mismatch").hidden =
          !replyTarget ||
          (replyTarget.id === selectedThread.id &&
            replyTarget.boardIndex === selectedThread.boardIndex);
      };
      root.querySelector("#reply-open").addEventListener("click", () => {
        if (!replyTarget) replyTarget = { ...selectedThread };
        root.querySelector("#reply-target").textContent =
          `To ${replyTarget.board} · ${replyTarget.title}`;
        composer.hidden = false;
        updateReply();
        replyText.focus();
      });
      root.querySelector("#reply-hide").addEventListener("click", () => {
        composer.hidden = true;
        updateReply();
        root.querySelector("#reply-open").focus();
      });
      root.querySelector("#reply-expand").addEventListener("click", (event) => {
        const expanded = composer.classList.toggle("expanded");
        event.currentTarget.setAttribute("aria-expanded", String(expanded));
        event.currentTarget.setAttribute(
          "aria-label",
          expanded ? "Compact reply" : "Expand reply",
        );
        event.currentTarget.title = expanded ? "Compact reply" : "Expand reply";
      });
      replyText.addEventListener("input", () => {
        root.querySelector("#reply-review").disabled = !replyText.value.trim();
      });
      const replyDialog = root.querySelector("#reply-dialog");
      root.querySelector("#reply-review").addEventListener("click", () => {
        root.querySelector("#review-target").textContent =
          `demo-member → ${replyTarget.board} · ${replyTarget.title}`;
        root.querySelector("#review-copy").textContent = replyText.value;
        replyDialog.showModal();
      });
      root
        .querySelector("#review-close")
        .addEventListener("click", () => replyDialog.close());
      const filter = root.querySelector("#filter");
      const filterCards = () => {
        const cards = [...root.querySelectorAll(".board-card")];
        const query = filter.value.trim().toLocaleLowerCase();
        cards.forEach((card) => {
          card.style.display = card.textContent
            .toLocaleLowerCase()
            .includes(query)
            ? ""
            : "none";
        });
        root.querySelector("#count").textContent =
          `Preview boards shown: ${cards.filter((card) => card.style.display !== "none").length} / ${cards.length}`;
      };
      filter.addEventListener("input", filterCards);
      filterCards();
      showView("results");
    </script>
  </body>
</html>
