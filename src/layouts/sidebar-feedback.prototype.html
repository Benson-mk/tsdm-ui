            (mark) =>
              mark.type.name === "format" &&
              mark.attrs.frames.some((frame) => frame.tag === tag),
          );
        if (selection.empty)
          return hasFormat(storedMarks ?? selection.$from.marks());
        const selected = [];
        doc.nodesBetween(selection.from, selection.to, (node) => {
          if (node.isInline) selected.push(hasFormat(node.marks));
        });
        return selected.length > 0 && selected.every(Boolean);
      };
      const syncEditor = (snapshot) => {
        view.updateState(session.pmState);
        root.querySelector("#reply-review").disabled =
          !session.pmState.doc.textContent.trim();
        root.querySelector('[data-format="undo"]').disabled = !snapshot.canUndo;
        root.querySelector('[data-format="redo"]').disabled = !snapshot.canRedo;
        for (const tag of ["b", "i", "u"])
          root
            .querySelector(`[data-format="${tag}"]`)
            .setAttribute("aria-pressed", String(formatActive(tag)));
        root.querySelector("#editor-message").textContent = snapshot.message;
        root.querySelector("#editor-message").hidden = !snapshot.message;
      };
      session.subscribe(syncEditor);
      syncEditor(session.state);
      root.querySelectorAll("[data-format]").forEach((button) => {
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => {
          if (view.composing) return;
          const tool = button.dataset.format;
          if (["undo", "redo"].includes(tool)) session[tool]();
          else if (["ul", "ol"].includes(tool))
            session.command("list", { ordered: tool === "ol" });
          else if (["quote", "code"].includes(tool)) session.command(tool);
          else
            session.command("format", {
              tag: tool,
              remove: formatActive(tool),
            });
          view.focus();
        });
      });
      const updateReply = () => {
        root.querySelector("#reply-open").hidden = !!replyTarget;
        root.querySelector("#reply-resume").hidden =
          !replyTarget || !composer.hidden;
        root.querySelector("#resume-target").textContent = replyTarget
          ? `${replyTarget.board} · ${replyTarget.title}`
          : "";
        sizeColumns();
        root.querySelector("#reply-mismatch").hidden =
          !replyTarget ||
          (replyTarget.id === selectedThread.id &&
            replyTarget.boardIndex === selectedThread.boardIndex);
      };
      const openReply = () => {
        if (!replyTarget) replyTarget = { ...selectedThread };
        root.querySelector("#reply-target").textContent =
          `To ${replyTarget.board} · ${replyTarget.title}`;
        composer.hidden = false;
        updateReply();
        view.focus();
      };
      root.querySelector("#reply-open").addEventListener("click", openReply);
      root.querySelector("#reply-resume").addEventListener("click", openReply);
      root.querySelector("#reply-hide").addEventListener("click", () => {
        composer.hidden = true;
        updateReply();
        root.querySelector("#reply-resume").focus();
      });
      root.querySelector("#reply-expand").addEventListener("click", (event) => {
        const expanded = composer.classList.toggle("expanded");
        event.currentTarget.setAttribute("aria-expanded", String(expanded));
        event.currentTarget.setAttribute(
          "aria-label",
          expanded ? "Compact reply" : "Expand reply",
        );
        event.currentTarget.title = expanded ? "Compact reply" : "Expand reply";
        event.currentTarget.innerHTML = icon(expanded ? "compact" : "expand");
        sizeColumns();
      });
      const replyDialog = root.querySelector("#reply-dialog");
      root.querySelector("#reply-review").addEventListener("click", () => {
        root.querySelector("#review-target").textContent =
          `demo-member → ${replyTarget.board} · ${replyTarget.title}`;
        const preview = view.dom.cloneNode(true);
        preview.contentEditable = "false";
        preview.removeAttribute("role");
        preview.removeAttribute("aria-label");
        root.querySelector("#review-copy").replaceChildren(preview);
        replyDialog.showModal();
      });
      root
        .querySelector("#review-close")
        .addEventListener("click", () => replyDialog.close());
      const copyDialog = root.querySelector("#copy-dialog");
      root.querySelector("#copy-url").addEventListener("click", async () => {
        const link = new URL(location.pathname, location.origin);
        link.search = new URLSearchParams({
          variant: "A",
          board: String(selectedThread.boardIndex),
          thread: String(selectedThread.id),
          page: String(page),
          reverse: String(reverse),
        }).toString();
        try {
          await navigator.clipboard.writeText(link.href);
          root.querySelector(".preview-state").textContent =
            "Preview URL copied. Production would use the public forum thread URL.";
        } catch {
          root.querySelector("#copy-value").value = link.href;
          copyDialog.showModal();
          root.querySelector("#copy-value").select();
        }
      });
      root
        .querySelector("#copy-close")
        .addEventListener("click", () => copyDialog.close());
      const filter = root.querySelector("#filter");
      const filterCards = () => {
        const cards = [...root.querySelectorAll(".board-card")];
        const query = filter.value.trim().toLocaleLowerCase();
        cards.forEach((card) => {
          card.style.display = card.textContent
            .toLocaleLowerCase()
            .includes(query)
            ? ""
            : "none";
        });
        root.querySelector("#count").textContent =
          `Preview boards shown: ${cards.filter((card) => card.style.display !== "none").length} / ${cards.length}`;
      };
      filter.addEventListener("input", filterCards);
      filterCards();
      showView("results");
      const initialBoard = Number(url.searchParams.get("board"));
      const initialThread = sampleThreads.find(
        (thread) => String(thread.id) === url.searchParams.get("thread"),
      );
      if (
        url.searchParams.has("board") &&
        Number.isInteger(initialBoard) &&
        initialBoard >= 0 &&
        initialBoard < boards.length &&
        initialThread
      ) {
        showBoard(initialBoard);
        root.querySelector(`[data-thread="${initialThread.id}"]`).click();
        const initialPage = Number(url.searchParams.get("page"));
        page =
          Number.isInteger(initialPage) && initialPage >= 1 && initialPage <= 92
            ? initialPage
            : 1;
        reverse = url.searchParams.get("reverse") === "true";
        renderPage();
      }
    </script>
  </body>
</html>
