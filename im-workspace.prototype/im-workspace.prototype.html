<!doctype html>
<!-- Three disposable forum layouts, ?variant=A|B|C. Synthetic data; no production framework decision. -->
<html lang="zh-TW" data-theme="Light" data-density="Default" data-variant="A" data-screen="reader">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Only text size is durable in this synthetic demo. Restore it before styles paint.
const textSizeStorageKey = 'tsdm-im-workspace.prototype.text-size';
let textSizeStorageAvailable = true, initialTextSize = 100;
try {
  const saved = Number(localStorage.getItem(textSizeStorageKey));
  if (saved >= 70 && saved <= 150 && saved % 10 === 0) initialTextSize = saved;
} catch { textSizeStorageAvailable = false; }
document.documentElement.dataset.textSize = initialTextSize;
document.documentElement.dataset.density = initialTextSize < 100 ? 'Compact' : 'Default';
document.documentElement.style.setProperty('--text-scale', initialTextSize / 100);
</script>
<title>TSDM · Workspace study</title><link rel="stylesheet" href="prototype.css">
<body>
<div id="shell">
<header id="topbar"><div class="brand">TSDM<span class="eyebrow">A PLACE TO TALK</span></div><button id="back" class="icon" data-action="back" aria-label="返回">←</button><span id="breadcrumb"></span><div class="top-actions"><button id="return-writing-shortcut" class="icon compact" hidden data-action="return-writing" data-label="returnWriting">✎</button><button data-action="account" class="account"><span class="avatar small-avatar">我</span><span data-i="member"></span></button><button class="icon" data-action="settings" data-label="settings">⚙</button></div></header>
<nav id="nav" aria-label="Main navigation"><span class="logo">t</span><button data-dest="boards"><span>▦</span><span data-i="boards"></span></button><button data-dest="search"><span>⌕</span><span data-i="search"></span></button><button data-dest="favorites"><span>◇</span><span data-i="favorites"></span></button><button data-dest="notifications"><span>♧</span><span data-i="notifications"></span></button><button data-dest="drafts"><span>▤</span><span data-i="drafts"></span></button><button class="nav-bottom" data-action="settings"><span>⚙</span><span data-i="settings"></span></button></nav>
<aside id="boards" aria-labelledby="context-title"><h2 id="context-title"></h2><div id="board-options"></div><p class="eyebrow board-note">WORKSPACE / CONTEXT</p><p id="context-note" class="board-note"></p><span class="chip board-note" data-i="synthetic"></span></aside>
<section id="list"><header id="list-head"><button class="compact secondary small" data-action="choose-board"><span id="context-picker-label"></span> ↗</button><div class="row"><h2 id="list-title" class="grow"></h2><button class="icon outline" data-action="new" data-label="newThread">＋</button></div><p class="meta" id="list-description"></p><label class="sr-only" for="search" data-i="searchHint"></label><input id="search" type="search"><div class="row list-filter"><span id="list-filter" class="chip"></span><button hidden id="refresh" class="small" data-action="refresh" data-i="refresh"></button></div></header><div id="thread-list"></div><p class="list-note meta" data-i="listNote"></p></section>
<main id="reader"><div id="tabs" aria-label="Open threads"></div><div id="reader-scroll"><section id="section-overview" hidden aria-labelledby="overview-title"><p class="eyebrow" data-i="overview"></p><h1 id="overview-title"></h1><p class="overview-description" id="overview-description"></p><div id="overview-browsing"><dl class="overview-facts"><div><dt data-i="scope"></dt><dd id="overview-scope"></dd></div><div><dt data-i="sampleResults"></dt><dd id="overview-count"></dd></div></dl><p class="meta" data-i="chooseResult"></p><button class="compact primary" data-action="browse" data-i="viewResults"></button></div><aside id="return-writing" hidden><p class="eyebrow" data-i="writingInProgress"></p><p class="meta" id="overview-writing-target"></p><button class="outline" data-action="return-writing" data-i="returnWriting"></button></aside></section><section id="recovery" hidden></section><div id="thread-view"><header id="thread-head"><div class="row"><span id="category" class="chip"></span><span class="eyebrow">FORUM / FIELD NOTES</span><button class="compact secondary small" data-action="browse"><span data-i="browse"></span> ↗</button></div><h1 id="thread-title"></h1><div id="thread-meta" class="meta row"></div><div class="row thread-actions"><button class="primary" data-action="reply" data-i="reply"></button><button class="outline" data-action="favorite" data-i="favorite"></button><button class="secondary" data-action="last" data-i="last"></button></div><p class="reading-note" data-i="readingNote"></p></header><div class="pagination" id="pages-top"></div><div id="posts"></div><div class="pagination" id="pages-bottom"></div><p class="endnote" data-i="endnote"></p></div></div>
<section id="composer" class="collapsed"><div class="row"><span>✎</span><h2 id="compose-heading" class="grow"></h2><button class="secondary small" data-action="toggle-compose" id="toggle-compose"></button></div><div id="compose-fields"><p id="compose-target" class="meta"></p><div id="new-fields" hidden><label for="compose-title" data-i="title"></label><input id="compose-title"><label for="compose-category" data-i="category"></label><select id="compose-category"><option data-i="discussion"></option><option data-i="sharing"></option></select></div><blockquote id="quote-preview" hidden></blockquote><div id="toolbar" aria-label="Toolbar placement only"><button disabled><b>B</b></button><button disabled><i>I</i></button><button disabled>❞</button><button disabled>@</button><button disabled>▧</button><button disabled>↥</button><button disabled>BBCode</button></div><label class="sr-only" for="compose-body" data-i="body"></label><textarea id="compose-body"></textarea><p class="editor-note" data-i="editorNote"></p><div class="row"><button class="primary" id="send" data-action="send" data-i="send"></button><button id="save-draft" class="secondary" data-action="save" data-i="save" hidden></button><button data-action="discard" data-i="discard"></button></div><div id="compose-status" role="status"></div></div></section></main>
</div>
<footer id="lab"><div class="lab-title"><strong>LAYOUT STUDY · 01</strong><br><span data-i="localOnly"></span></div><div id="switcher"><button class="icon" data-action="prev" aria-label="Previous layout">←</button><span id="variant-name"></span><button class="icon" data-action="next" aria-label="Next layout">→</button></div><button class="outline small" data-action="lab" data-i="studyNotes"></button></footer>
<dialog id="settings"><div class="row"><h2 class="grow" data-i="settings"></h2><button class="icon" data-close="settings" aria-label="Close">×</button></div><p data-i="settingsHelp"></p><strong data-i="theme"></strong><div id="themes"><button data-theme="Light"><span style="background:#a29bba"></span>Light</button><button data-theme="Alias"><span style="background:#c2b8da"></span>Alias</button><button data-theme="Mono"><span style="background:#c5c5c5"></span>Mono</button><button data-theme="Dark"><span style="background:#000"></span>Dark</button></div><div id="text-size-control"><label for="text-size"><span data-i="textSize"></span></label><div class="row"><output id="text-size-value" for="text-size">100%</output><span class="meta grow" id="text-size-mode"></span><button id="reset-text-size" class="small outline" data-i="resetTextSize"></button></div><input id="text-size" type="range" min="70" max="150" step="10" value="100" aria-describedby="text-size-mode text-size-help text-size-storage"><p id="text-size-help" class="meta" data-i="textSizeHelp"></p><p id="text-size-storage" class="meta" hidden data-i="textSizeSession"></p></div><label><span data-i="language"></span><select id="language"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><p class="meta" data-i="languageHelp"></p></dialog>
<dialog id="picker"><div class="row dialog-head"><h2 class="grow" data-i="browse"></h2><button class="icon" data-close="picker" aria-label="Close">×</button></div><div id="picker-content"></div></dialog>
<dialog id="guard"><h2 data-i="unsent"></h2><p data-i="unsentHelp"></p><div class="row"><button class="primary" data-action="keep" data-i="keep"></button><button class="outline" data-action="replace" data-i="replace"></button></div></dialog>
<dialog id="notes"><div class="row"><h2 class="grow" data-i="studyNotes"></h2><button class="icon" data-close="notes" aria-label="Close">×</button></div><p id="variant-description"></p><p class="meta" data-i="limits"></p><label><span data-i="scenario"></span><select id="scenario"><option value="normal" data-i="normal"></option><option value="permission" data-i="permission"></option><option value="challenge" data-i="challenge"></option><option value="missing" data-i="missing"></option></select></label><label><span data-i="outcome"></span><select id="outcome"><option value="success" data-i="success"></option><option value="unknown" data-i="unknown"></option></select></label><p class="eyebrow">CURRENT PROTOTYPE STATE</p><pre id="state"></pre></dialog>
<dialog id="account"><div class="row"><h2 class="grow" data-i="member"></h2><button class="icon" data-close="account" aria-label="Close">×</button></div><p data-i="accountHelp"></p><span class="chip" data-i="synthetic"></span></dialog>
<div id="toast" role="status" hidden></div><script src="prototype.js"></script></body></html>
